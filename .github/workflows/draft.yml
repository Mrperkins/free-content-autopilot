name: Produce one reviewable video draft
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  actions: read
concurrency:
  group: free-autopilot-draft
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install zero-cost local dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install 'Pillow>=10,<13'
      - name: Draft only after owner approves a niche
        run: python -m autopilot.cli draft --output work/draft.json
      - name: Render original video
        if: ${{ hashFiles('work/draft.json') != '' }}
        run: python -m autopilot.cli render --input work/draft.json --output work/rendered
      - name: Upload exact video to review artifact (NOT YouTube)
        if: ${{ hashFiles('work/rendered/video.mp4') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: draft-${{ github.run_id }}
          path: |
            work/rendered/video.mp4
            work/rendered/draft.json
          retention-days: 14
          if-no-files-found: error
      - name: Ask owner to approve or reject the exact video
        if: ${{ hashFiles('work/rendered/video.mp4') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m autopilot.cli issue-draft --input work/draft.json --output work/rendered/video.mp4
