name: Offline safety and unit tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free rendering library for import checks
        run: python -m pip install 'Pillow>=10,<13'
      - run: python -m unittest discover -s tests -v
